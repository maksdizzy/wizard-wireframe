<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Creation Wizard - Success</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            primary: '#121212',
                            secondary: '#1e1e1e',
                            tertiary: '#2d2d2d',
                            border: '#333333',
                        },
                        accent: {
                            primary: '#3b82f6',
                            secondary: '#10b981',
                            tertiary: '#f43f5e',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="bg-dark-primary text-white min-h-screen">
    <!-- Header -->
    <header class="bg-dark-secondary border-b border-dark-border">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center w-full md:w-auto justify-between">
                <h1 class="text-xl font-bold">Application Creation Wizard</h1>
                <button class="md:hidden text-white mobile-menu-button">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
            
            <!-- User menu -->
            <div class="hidden md:flex items-center mt-4 md:mt-0">
                <div class="relative">
                    <button class="flex items-center space-x-2 focus:outline-none">
                        <div class="w-8 h-8 rounded-full bg-accent-primary flex items-center justify-center">
                            <span class="text-sm font-medium">JD</span>
                        </div>
                        <span>John Doe</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main content -->
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto text-center">
            <!-- Success animation -->
            <div class="mb-6 inline-block">
                <div class="w-24 h-24 rounded-full bg-accent-secondary bg-opacity-20 flex items-center justify-center mx-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-accent-secondary" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                </div>
            </div>
            
            <h2 class="text-2xl font-bold mb-4">Your application 'My DeFi App' is ready!</h2>
            <p class="text-gray-400 mb-8">Your application has been successfully created and deployed.</p>
            
            <!-- Application links -->
            <div class="bg-dark-secondary rounded-lg p-6 border border-dark-border mb-8">
                <h3 class="text-lg font-medium mb-4">Access Your Application</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Web App Link -->
                    <a href="#" class="block p-4 bg-dark-tertiary rounded-lg hover:bg-opacity-80 transition duration-200">
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-full bg-blue-900 flex items-center justify-center mr-3">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-200" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M10 2a8 8 0 100 16 8 8 0 000-16z" />
                                </svg>
                            </div>
                            <div class="text-left">
                                <p class="font-medium">Web Application</p>
                                <p class="text-sm text-gray-400">app.mydefiapp.com</p>
                            </div>
                        </div>
                    </a>
                    
                    <!-- Telegram Bot Link -->
                    <a href="#" class="block p-4 bg-dark-tertiary rounded-lg hover:bg-opacity-80 transition duration-200">
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-full bg-blue-900 flex items-center justify-center mr-3">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-200" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M10 2a8 8 0 100 16 8 8 0 000-16z" />
                                </svg>
                            </div>
                            <div class="text-left">
                                <p class="font-medium">Telegram Bot</p>
                                <p class="text-sm text-gray-400">t.me/MyDeFiAppBot</p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
            
            <!-- Action buttons -->
            <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4">
                <a href="../dashboard-populated.html" class="flex-1 px-6 py-3 bg-accent-primary hover:bg-blue-600 text-white rounded-md transition duration-200 flex items-center justify-center">
                    Go to Dashboard
                </a>
                <a href="#" class="flex-1 px-6 py-3 border border-dark-border hover:bg-dark-tertiary text-white rounded-md transition duration-200 flex items-center justify-center">
                    Application Settings
                </a>
            </div>
        </div>
    </main>

    <script src="../js/main.js"></script>
</body>
</html>
