<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Creation Wizard - Login</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            primary: '#121212',
                            secondary: '#1e1e1e',
                            tertiary: '#2d2d2d',
                            border: '#333333',
                        },
                        accent: {
                            primary: '#3b82f6',
                            secondary: '#10b981',
                            tertiary: '#f43f5e',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-dark-primary text-white min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-8 space-y-8 bg-dark-secondary rounded-lg shadow-lg">
        <div class="text-center">
            <h1 class="text-2xl font-bold">Application Creation Wizard</h1>
            <p class="mt-2 text-gray-400">Sign in to your account</p>
        </div>
        <form class="mt-8 space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-300">Email address</label>
                <input id="email" name="email" type="email" required class="mt-1 block w-full px-3 py-2 bg-dark-tertiary border border-dark-border rounded-md shadow-sm focus:outline-none focus:ring-accent-primary focus:border-accent-primary">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
                <input id="password" name="password" type="password" required class="mt-1 block w-full px-3 py-2 bg-dark-tertiary border border-dark-border rounded-md shadow-sm focus:outline-none focus:ring-accent-primary focus:border-accent-primary">
            </div>
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 bg-dark-tertiary border-dark-border rounded focus:ring-accent-primary">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-300">Remember me</label>
                </div>
                <div class="text-sm">
                    <a href="#" class="font-medium text-accent-primary hover:text-blue-400">Forgot your password?</a>
                </div>
            </div>
            <div>
                <a href="dashboard-empty.html" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-accent-primary hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-primary">
                    Sign in
                </a>
            </div>
        </form>
        <div class="mt-6">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-dark-border"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-dark-secondary text-gray-400">Or continue with</span>
                </div>
            </div>
            <div class="mt-6 grid grid-cols-3 gap-3">
                <div>
                    <a href="#" class="w-full flex items-center justify-center px-4 py-2 border border-dark-border rounded-md shadow-sm text-sm font-medium text-gray-300 bg-dark-tertiary hover:bg-gray-700">
                        <span>Google</span>
                    </a>
                </div>
                <div>
                    <a href="#" class="w-full flex items-center justify-center px-4 py-2 border border-dark-border rounded-md shadow-sm text-sm font-medium text-gray-300 bg-dark-tertiary hover:bg-gray-700">
                        <span>GitHub</span>
                    </a>
                </div>
                <div>
                    <a href="#" class="w-full flex items-center justify-center px-4 py-2 border border-dark-border rounded-md shadow-sm text-sm font-medium text-gray-300 bg-dark-tertiary hover:bg-gray-700">
                        <span>Twitter</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
